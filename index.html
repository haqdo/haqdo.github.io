<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ha Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'EB Garamond', serif;
      background: #c8dff0;
      color: #6b1a1a;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2rem 3rem;
      border-bottom: 1px solid rgba(107,26,26,0.25);
    }

    .nav-name {
      font-size: 1.3rem;
      font-weight: 500;
      color: #6b1a1a;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      font-size: 1.05rem;
      color: #6b1a1a;
      text-decoration: none;
      font-style: italic;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

    /* HOME */
    #home {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5rem 3rem;
      gap: 2rem;
      max-width: 700px;
      margin: 0 auto;
    }

    #home img {
      width: 240px;
      height: 240px;
      object-fit: cover;
      object-position: center 30%;
      border-radius: 50%;
    }

    #home h1 {
      font-size: 2.4rem;
      font-weight: 400;
      text-align: center;
    }

    #home p {
      font-size: 1.15rem;
      line-height: 1.9;
      text-align: center;
    }

    /* CV */
    #cv {
      max-width: 900px;
      margin: 0 auto;
      padding: 4rem 3rem;
    }

    #cv h2 {
      font-size: 1.8rem;
      font-weight: 400;
      margin-bottom: 1.5rem;
    }

    #cv iframe {
      width: 100%;
      height: 85vh;
      border: 1px solid rgba(107,26,26,0.25);
      display: block;
    }

    /* FUN */
    #fun {
      max-width: 700px;
      margin: 0 auto;
      padding: 4rem 3rem;
    }

    #fun h2 {
      font-size: 1.8rem;
      font-weight: 400;
      margin-bottom: 1.8rem;
    }

    .fun-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }

    .fun-list li h3 {
      font-size: 1.15rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .fun-list li p {
      font-size: 1.05rem;
      line-height: 1.8;
      font-style: italic;
    }

    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid rgba(107,26,26,0.2);
      font-size: 1rem;
      color: rgba(107,26,26,0.55);
    }

    footer a {
      color: #6b1a1a;
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      nav { padding: 1.5rem; flex-direction: column; gap: 1rem; }
      #home, #cv, #fun { padding: 3rem 1.5rem; }
      #home img { width: 180px; height: 180px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="#home" class="nav-name">Ha Do</a>
    <div class="nav-links">
      <a href="#home">Home</a>
      <a href="#cv">CV</a>
      <a href="#fun">Fun</a>
    </div>
  </nav>

  <!-- HOME -->
<section id="home">
  <div style="display:flex; align-items:center; gap:3rem; max-width:800px; margin:0 auto; padding:5rem 3rem;">
    <img src="your-photo.jpg" style="width:220px; height:220px; border-radius:50%; object-fit:cover; flex-shrink:0;" alt="Ha Do" />
    <div>
      <h1 style="font-size:2.4rem; font-weight:400; margin-bottom:1rem;">Ha Do</h1>
      <p style="font-size:1.15rem; line-height:1.9;">
        I am an undergraduate researcher in astrophysics at the University of Chicago.
      </p>
    </div>
  </div>
</section>

  <!-- CV -->
  <section id="cv">
    <h2>CV</h2>
    <iframe src="Ha Do CV (13).pdf" title="Ha Do CV"></iframe>
  </section>

  <!-- FUN -->

  <footer>
    <p>Ha Do &middot; <a href="mailto:hado@uchicago.edu">hado@uchicago.edu</a></p>
  </footer>

</body>
</html>
